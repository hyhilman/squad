# Written by `init` from the image for this repo. Init never rewrites this file.
# version is the engine release this repo runs. To upgrade, change it, commit it, and run .doppelganger/dg up.
# The lines without a leading # are the ones init set. Go live by setting dry_run = false under [flow].
# Commit this file. It holds no secret: tokens go in doppelganger.secret.toml.

# doppelganger settings: every setting that is not a secret, one row each.
#
# Copy this file to `doppelganger.toml` in the project root and edit the copy. Commit the copy: it
# holds the settings your team shares, so it never holds a secret. Tokens go in a second file,
# `doppelganger.secret.toml`, which is gitignored (doppelganger.secret.example.toml lists them).
# A secret in this file stops the supervisor and `npm run job` at start.
#
#   cp doppelganger.example.toml doppelganger.toml
#
# These two files are the only place settings live. Nothing reads a `.env` file any more.
#
# HOW TO READ A ROW. The comment above each key is the row's own `why`. The code holds the one
# copy of each `why`, and this file repeats it word for word.
# A key that is commented out shows its default. Remove the `#` only to change it.
# A key that is not commented out is required, and its value here is only an example.
# A line like `[<name>] db` is a family: write the real name in the brackets, then the key.
#
# A value is a TOML string, number, true or false, or a list. A flag is 1 or 0 in the code:
# write true or false, or 1 or 0. A list is a TOML array, or one string with commas.
#
# A row shown with a `[[name]]` header is an array of tables: write one `[[name]]` header for each
# entry, with the entry's keys under it. Put the entries after the plain keys of the same table. A
# process variable cannot set one, and `doppelganger.secret.toml` cannot hold one.
#
# WHICH VALUE WINS. An environment variable named like the old key beats both files, for example
# `FLOW_DRY_RUN=1 npm run job watch-flow`. A schedule entry's `env:` does the same. Then comes
# `doppelganger.secret.toml`, then this file. A non-secret key may sit in either file, so a value
# that differs per machine can go in the secret file. Each key that the environment and a file both
# set is logged at start as the event `settings-override`, without its value.
#
# A key in either file that no row explains stops the supervisor and `npm run job` at start, so a
# typo never passes in silence.
#
# These come only from the environment and are never in either file:
#   PROJECT_ROOT          the project to work on (the folder you run from, if unset)
#   DOPPELGANGER_CONFIG  the path of this file, or none for no file; the secret file is the one
#                        beside it
#   FLEET_ROLE            the role of this container: standalone, scheduler or worker; compose sets it
#   RELEASE_DRY_RUN      the release tool, which is not in the package
#
# test/knobs.test.ts holds this file to the code.

# names this checkout; discriminates every host-global write
instance = "squad-77a298h"

# the engine release this repo runs: an exact version like 0.1.0-rc.1, or the channel dev (every dev build) or rc (the newest release candidate); image mode picks the image by it, and a built engine whose own version is not the exact pin refuses to start
version = "0.5.0-rc.6"

# the plugins this checkout runs, built-in and attached, as comma-separated names; unset runs every plugin, the project's own included, except those that only fit the engine's own source when ROOT is another folder; an unknown name, or such a plugin named there, refuses at boot
plugins = ["github", "coder", "todo", "ops"]

[engine]

# where every integration's database lives, resolved inside the checkout
# state_dir = ".doppelganger/state"

[run]

# wall-clock bound on one agent run; only used for jobs that are not taskClass: impl
# timeout_ms = 1500000

# pi, codex and dsh passes: kill a pass only after this long with no output (a heartbeat, not a deadline)
# idle_ms = 600000

# the ceiling for a taskClass: impl run, which builds and verifies
# timeout_impl_ms = 2400000

[agent]

# the most agent runs (any job, any runner) alive at once on this instance
# max_concurrent = 3

[runner]

# kill switch: pi and codex passes go to the old pi and codex runners, on the folders under .doppelganger/creds/, and not through squad
# no_squad = 0

[squad]

# the squad home of this project, relative to the project root: squad's accounts, locks, database and pass logs (mode 0700, never committed); unused when [squad] url names a shared squad
# home = ".doppelganger/squad"

# where a shared `squad serve` on this machine listens, as unix:/path/to/squad.sock or http://127.0.0.1:<port>, reached with [squad] token; left empty, squad runs inside this process with its home at [squad] home
# url = ""

[sqlite]

# how long a statement waits on a held write lock; deliberately unchanged while the cause is unknown
# busy_timeout_ms = 5000

[audit]

# kill switch: write no flow event, agent pass or job run to the audit store
# no_record = 0

[lock]

# consecutive lock-held skips before a job counts as starved at the gate
# starve_n = 6

# raise the starve threshold for one job whose cadence makes 6 skips normal
# [lock] starve_n_<job>

# seconds one program may keep entering a resource it already holds, queued waiter or not — the longest agent pass (RUN_TIMEOUT_IMPL_MS) plus three watch-flow ticks at their defaults, so the first tick after a pass still joins it; 0 = the queue always wins
# reenter_max_s = 4500

[log]

# below this level a line is dropped by both emitters
# level = "info"

# rotate a log above this; ~4x normal traffic, so it fires on a runaway job
# max_bytes = 8388608

# cap on what one tick reads from one file, so a runaway cannot pull itself into memory before rotation bounds it
# max_read_bytes = 4194304

# minutes before the same job/event fault is posted again; a new fault is never delayed
# report_cooldown_m = 30

# fault keys shown in one report; the rest become one '…and N more' line
# report_max_keys = 8

# 1 = print the report to stdout; post nothing, stamp nothing, move no log cursor
# report_dry_run = 0

[exec]

# wall-clock bound on ONE gh/git call; an unbounded stalled gh blocks the event loop so lease heartbeats stop
# timeout_ms = 180000

# an optional GitHub identity under .doppelganger/creds/gh/, used with every runner: the flow tick and its steps use it for their own `gh` calls and `git fetch`/`push` (https with that token), and each pi, codex or dsh pass gets it mounted read-only so the agent can read the issue and PR; empty = the ambient login for the flow and no gh login in a pi, codex or dsh container
# gh = ""

# 1 = routed entries whose providers sell the model at the same price take turns going first, one turn per issue (round robin from a random start, counted in the running process and lost on a restart), so the passes of an issue and its PR keep one provider; 0 = they keep the order of the `providers` table. A cheaper provider always goes before a dearer one
# route_balance = 0

# the address of a models.dev style catalog (a JSON object of providers, each with `models`, their `cost` per million tokens and their `canonical_model_id`) that finds and orders the providers of a routed pi entry, cheapest first, and that ops-models-sync reads to renew the model list in each custom pi provider's models.json; no key in the address. A copy for routing is kept under .doppelganger/state/ for 6 hours and a catalog that cannot be reached keeps the old copy. Empty = a routed entry is a problem reported at start, and ops-models-sync does nothing
# prices_url = ""

# 1 = ops-models-sync logs the models it would add, drop and change in each pi credential's models.json, and writes nothing
# models_sync_dry_run = 0

# ops-price-watch prices the tokens of the run logs written in the last this many days
# price_watch_days = 7

# ops-price-watch posts a cheaper provider only when it would save at least this many dollars a week on the tokens the runs used
# price_watch_min_usd = 2

# days before ops-price-watch posts the same cheaper provider for a model again; a new cheapest provider is posted at once
# price_watch_cooldown_days = 7

# 1 = ops-price-watch prints the message it would post; it posts nothing and writes no state
# price_watch_dry_run = 0

# an array of tables, one [[exec.executor]] per provider, for the change and fix passes of the coder step. An entry holds `runner` (claude, pi, codex or dsh, required), `model` (pi or dsh: <provider>/<model>, required, where a dsh entry's provider is the one in its pi credential's models.json; codex: an OpenAI model id, or the id a local server gives its model, required; claude: optional, the job's own model when left out), `creds` (pi or dsh: one name or a list under .doppelganger/creds/pi/, required, and a dsh entry needs one with models.json and an API key; codex: the same under .doppelganger/creds/codex/, required, but optional for a codex entry with an endpoint; claude: none) and `endpoint` (codex only: the http:// or https:// base URL of an OpenAI-compatible server). A pi entry may instead hold `route = "cheapest"`, a `model` that is the canonical id of the lab model (<lab>/<model>, such as deepseek/deepseek-v4-pro, as the catalog's `canonical_model_id` has it), and a `providers` table of provider = credential name (or list of names): it stands for one entry per provider that sells the model, cheapest first by the prices at exec.prices_url, and takes no `creds`. The first entry runs first. A pass that fails goes on to a later credential or entry, again and again, until a pass works or none is left: a quota/auth/rate-limit refusal goes to the next credential, then the next entry; a `blocked` result or a provider error goes to the next entry. An idle, a timeout or an unknown failure does not go on. None = one claude entry on the job's own model. A process variable cannot set it
# [[exec.executor]]
# runner = "pi"
# model = "opencode-go/deepseek-v4.1-flash"
# creds = "my-opencode-go"
#
# [[exec.executor]]
# runner = "pi"
# model = "opencode-go/deepseek-v4-pro"
# creds = ["account-a", "account-b"]
#
# [[exec.executor]]
# runner = "claude"
# model = "claude-opus-5"
#
# [[exec.executor]]
# runner = "pi"
# route = "cheapest"
# model = "deepseek/deepseek-v4-pro"
# [exec.executor.providers]
# opencode-go = "my-opencode-go"
# sumopod = "my-sumopod"

# an array of tables, one [[exec.reviewer]] per provider, for the review pass of the coder step; pick a different family from the executor's, so the reviewer does not share its blind spots. An entry holds `runner` (claude, pi, codex or dsh, required), `model` (pi or dsh: <provider>/<model>, required, where a dsh entry's provider is the one in its pi credential's models.json; codex: an OpenAI model id, or the id a local server gives its model, required; claude: optional, the job's own model when left out), `creds` (pi or dsh: one name or a list under .doppelganger/creds/pi/, required, and a dsh entry needs one with models.json and an API key; codex: the same under .doppelganger/creds/codex/, required, but optional for a codex entry with an endpoint; claude: none) and `endpoint` (codex only: the http:// or https:// base URL of an OpenAI-compatible server). A pi entry may instead hold `route = "cheapest"`, a `model` that is the canonical id of the lab model (<lab>/<model>, such as deepseek/deepseek-v4-pro, as the catalog's `canonical_model_id` has it), and a `providers` table of provider = credential name (or list of names): it stands for one entry per provider that sells the model, cheapest first by the prices at exec.prices_url, and takes no `creds`. Tried in order: a quota/auth/rate-limit refusal goes to the next credential, then the next entry, again and again, until a pass works or none is left. None = one claude entry on the job's own model. A process variable cannot set it
# [[exec.reviewer]]
# runner = "pi"
# model = "opencode-go/mimo-v2.6-pro"
# creds = "my-opencode-go"
#
# [[exec.reviewer]]
# runner = "codex"
# model = "gpt-5-codex"
# creds = "my-openai"
#
# [[exec.reviewer]]
# runner = "codex"
# model = "qwen3-coder:30b"
# endpoint = "http://127.0.0.1:11434/v1"

# an array of tables, one [[exec.smart]] per provider, for the smart answerer of the flow (the place a parked item goes when `asks` is `smart`), the plan step and the ticket drafts. An entry holds `runner` (claude, pi, codex or dsh, required), `model` (pi or dsh: <provider>/<model>, required, where a dsh entry's provider is the one in its pi credential's models.json; codex: an OpenAI model id, or the id a local server gives its model, required; claude: optional, the job's own model when left out), `creds` (pi or dsh: one name or a list under .doppelganger/creds/pi/, required, and a dsh entry needs one with models.json and an API key; codex: the same under .doppelganger/creds/codex/, required, but optional for a codex entry with an endpoint; claude: none) and `endpoint` (codex only: the http:// or https:// base URL of an OpenAI-compatible server). A pi entry may instead hold `route = "cheapest"`, a `model` that is the canonical id of the lab model (<lab>/<model>, such as deepseek/deepseek-v4-pro, as the catalog's `canonical_model_id` has it), and a `providers` table of provider = credential name (or list of names): it stands for one entry per provider that sells the model, cheapest first by the prices at exec.prices_url, and takes no `creds`. Tried in order: a quota/auth/rate-limit refusal goes to the next credential, then the next entry, again and again, until a pass works or none is left. None = one claude entry on the job's own model. A process variable cannot set it
# [[exec.smart]]
# runner = "claude"

# an array of tables, one [[exec.cheap]] per provider, for the cheap role, which only fixes the `nit` findings of a passed review (one pass per PR, then a fresh review). An entry holds `runner` (claude, pi, codex or dsh, required), `model` (pi or dsh: <provider>/<model>, required, where a dsh entry's provider is the one in its pi credential's models.json; codex: an OpenAI model id, or the id a local server gives its model, required; claude: optional, the job's own model when left out), `creds` (pi or dsh: one name or a list under .doppelganger/creds/pi/, required, and a dsh entry needs one with models.json and an API key; codex: the same under .doppelganger/creds/codex/, required, but optional for a codex entry with an endpoint; claude: none) and `endpoint` (codex only: the http:// or https:// base URL of an OpenAI-compatible server). A pi entry may instead hold `route = "cheapest"`, a `model` that is the canonical id of the lab model (<lab>/<model>, such as deepseek/deepseek-v4-pro, as the catalog's `canonical_model_id` has it), and a `providers` table of provider = credential name (or list of names): it stands for one entry per provider that sells the model, cheapest first by the prices at exec.prices_url, and takes no `creds`. None = the role is off and nits stay in the review comment. A process variable cannot set it
# [[exec.cheap]]
# runner = "pi"
# model = "opencode-go/gpt-6-luna"
# creds = "my-opencode-go"

[runner.pi]

# the pinned pi image one pass runs in, a tag and never `latest`; unset, an installed release uses the pi image published for its own version, and an engine checkout uses this default (build it with `bin/runner.sh build pi`)
# image = "doppelganger-pi:1.1.0"

[runner.codex]

# the pinned codex image one codex pass runs in, a tag and never `latest`; no release publishes it, so build it with `bin/runner.sh build codex`
# image = "doppelganger-codex:0.162.1"

[runner.dsh]

# the pinned dsh (DeepSeek Harness) image one dsh pass runs in, a tag and never `latest`; no release publishes it, so build it with `bin/runner.sh build dsh`
# image = "doppelganger-dsh:0.2.0-rc.2"

[jev]

# an array of tables, one [[jev.providers]] per provider of Jev, the decision model a job may ask (the decide port). An entry holds `provider` (zen or openrouter; its key is jev.zen_key or jev.openrouter_key in doppelganger.secret.toml) and `model` (a pinned Jev id, such as jev-1.13-free on zen or typesafe/jev-1.13 on openrouter). Tried in order: a failed call goes to the next entry. None = no decision model, and a job takes its own safe default. A process variable cannot set it
# [[jev.providers]]
# provider = "zen"
# model = "jev-1.13-free"
#
# [[jev.providers]]
# provider = "openrouter"
# model = "typesafe/jev-1.13"

[quota]

# the host/factory account scope every standalone job shares — one switch, so whichever job discovers the limit parks the rest
# scope = "claude"

# the base re-probe window; every class scales it by a multiple, read per call
# pause_ms = 1800000

# pin one class's window in ms directly, when its cadence should not move with the others
# [quota] pause_ms_<class>

# how long after a window expires a fresh park still belongs to the SAME outage — the floor is the class's own window
# dark_gap_ms = 7200000

# how long after a spend wall opens a chore/watch job still sheds load for it, read per call like every other quota knob
# shed_window_ms = 86400000

# prints which breaker it would lift and lifts nothing
# clear_dry_run = 0

[step]

# how many times the switch may try to classify one row before it is dead-lettered
# cap_route = 5

# how many times a watcher may take one row, per route and stage, before it is dead-lettered
# cap_watch = 3

# how many mornings a brief may offer one row before it is dead-lettered
# cap_brief = 7

# the cap for a step kind nobody registered — finite, because an uncapped step is a silent loop
# cap_default = 10

[backlog]

# the todo a person writes for themselves, as one text; the same text twice is the same row, so a re-run adds no second one, and an empty text is refused
# add_text = ""

# 1 = print the row the text would become and write nothing
# add_dry_run = 0

# 1 = read the page's ticks and print the report, and revive nothing, write no page and post nothing
# dlq_dry_run = 0

# 1 = print the digest and send nothing, so no message arrives until a person asks for one. Default ON; set 0 to also send the same page through ntfy
# health_dry_run = 1

# hours a routed row may sit untouched before the digest counts it as stuck; the switch ticks every few minutes, so half a working day of silence is a route that fell behind
# health_stuck_h = 6

# hours an account may stay dark before the digest flags it as a breach; a limit that has not lifted in a day needs a person, not another re-probe
# dark_h = 24

# minutes without a finished switch tick before every source sweep logs an error, which ops-log-report posts: a stopped switch routes nothing and says nothing, and it ticks every 5 minutes, so half an hour is six missed ticks. 0 = never log it
# switch_stale_m = 30

[bug]

# 1 = print the digest a live tick would file and run no repro pass, writing nothing: no digest issue and no state file. Default ON; set 0 to file the report
# digest_dry_run = 1

# the lowest finding severity the digest reports: critical and high by default; blocking counts as high, and an unrecognised value falls back to high
# digest_min_severity = "high"

[clone]

# how many asks sharing one fingerprint count as a clone family worth surfacing
# detect_min_family = 3

[gate]

# longest a gate writer may block — a job whose own tick is rarer than this waits the cap, not its interval
# wait_cap_s = 1800

[supervisor]

# the runtime bound for one entry's child; 1.5x the longest legitimate pass
# max_run_min = 180

# SIGTERM -> this -> SIGKILL; the window to flush a stack trace, not to finish
# kill_grace_ms = 10000

# spacing between child starts, so two children do not race on ~/.gitconfig
# spawn_stagger_ms = 2000

# how long a child gets to exit on shutdown before it is killed; a process manager's own stop timeout must exceed it
# drain_ms = 30000

[watchdog]

# how many missed 60s supervisor heartbeats count as a dead scheduler; read by host/watchdog.sh, never by TypeScript
# supervisor_stale_m = 5

# the watchdog logs and prints its faults, writes no breach file and exits 0
# dry_run = 0

# kill switch: faults are still logged and still written to the breach file, only the POST is skipped — for someone working on the alarm path who must not page themselves
# no_notify = 0

[ntfy]

# base URL of the ntfy server the watchdog POSTs a breach to and the log report POSTs its report to; unset in both the environment and the settings files means no send at all, because a default would be a guess about someone else's host
# url = ""

# the ntfy topic a watchdog breach and a log report land on; defaults to INSTANCE (the checkout's folder name plus a hash of its path, or the `instance` setting), so two checkouts on one host never share an alarm channel
# topic = ""

[crontab]

# the crontab binary this tool calls; must be an absolute path, since a bare name is a PATH lookup. NO default on purpose: a real default is a real crontab binary, so a caller who forgets to set this must throw, not silently read the developer's own crontab
cmd = "/usr/bin/crontab"

# sync prints the crontab it would install and calls nothing; it still reads, since the read is what makes the printed diff true
# dry_run = 0

# sync adds a line that starts `claude rc` (remote control) in a tmux session of this repo every minute that session is gone
# rc = 0

# the tmux session name of that `claude rc`. Empty: the repo's folder name, with any character tmux cannot take turned into -
# rc_session = ""

# the `--spawn` mode of that `claude rc`: same-dir, worktree or session. Empty: no flag, so claude picks its own default
# rc_spawn = ""

[skills]

# sync prints the plan it would execute and writes nothing; still reads, since the read is what makes the printed plan true
# dry_run = 0

[lease]

# prints what it would delete and deletes nothing
# clear_dry_run = 0

[claim]

# 1 = the sweep runs every guard and logs the lease it would free, and deletes none
# reap_dry_run = 0

# the most leases one sweep frees; 0 is the free smoke test — every guard runs and nothing is deleted. The default is so large it is no cap in practice
# reap_max = 1000000

[session]

# 1 = the sweep runs every guard and logs the dead or idle session it would free and the old pi folder it would remove, and frees and removes none
# reap_dry_run = 0

# the most units one sweep frees: each dead session, each idle session and the old pi session folder is one; 0 is the free smoke test — every guard runs and nothing is freed or removed. The default is so large it is no cap in practice
# reap_max = 1000000

# a clean session nobody used for this many days is freed, since an id never run again would keep its transcript for ever. SESSION_REAP_DRY_RUN and SESSION_REAP_MAX apply too
# reap_idle_days = 60

[session_reap]

# kill switch: 1 turns the idle sweep off, so a clean session is never freed for being unused; the dead-owner sweep still runs
# no_idle = 0

[ops]

# 1 = print the fleet report and send nothing; the default until someone reads the channel, because the report already lands in this job's own log
# fleet_status_dry_run = 1

# 1 = print the report it would send and post nothing; the check still asks every profile
# hub_health_dry_run = 0

# the most profiles one run checks; 0 is the free smoke test — it reads the settings, asks no profile and posts nothing
# hub_health_max = 100

[dlq]

# prints what a revive would do and changes nothing
# dry_run = 0

[init]

# init prints every file it would write and every label it would create, and writes and creates nothing; it still reads the repo, the host and the tracker
# dry_run = 0

[config]

# migrate prints the keys it would write and their TOML paths, and writes nothing; it still reads .env
# dry_run = 0

[token]

# prints what token add and revoke would do and writes nothing
# dry_run = 0

[api]

# the address the instance API listens on; keep it on loopback and reach it through a tunnel, because the API speaks plain HTTP and its only guard is a bearer token
# bind = "127.0.0.1"

# the port the instance API listens on; 0 picks a free port, and api-up logs the one it got
# 7320 and 7321 belong to the xenith hub on this machine, 7330 and 7331 to the doppelganger repo.
port = 7341

# kill switch: doppelganger api logs api-killed and exits 0 without listening
# no_serve = 0

[web]

# the public origin of the web hub, such as https://doppelganger.example.com; required to start. Sign-in sends the browser back to it, and it must be https unless its host is the loopback
url = "https://squad.doppelganger.hilman.dev"

# the port doppelganger web listens on; 0 picks a free port, and web-up logs the one it got
port = 7340

# the address doppelganger web listens on; keep the loopback and put a TLS proxy or a tunnel in front, because the hub speaks plain HTTP
# bind = "127.0.0.1"

# the OIDC issuer URL, exactly as the identity server's discovery document names it; required to start
# The internal-apps client, shared with squad web. oidc_client_id is in the secret file: a real id
# looks like a secret to the config check.
oidc_issuer = "https://access.hilman.dev/application/o/internal-apps/"

# the OIDC client id of the web hub at the identity server; required to start
# oidc_client_id = ""

# a group the ID token's groups claim must hold; unset = any signed-in user with a verified email
# oidc_group = ""

# kill switch: doppelganger web logs web-killed and exits 0 without listening
# no_serve = 0

# an array of tables, one [[web.workspaces]] per supervisor the hub reads. An entry holds `name` (a lowercase letter, then lowercase letters, digits and dashes, required and unique), `url` (the base URL of that supervisor's instance API, required, https unless its host is the loopback) and `squad_web` (optional: the https origin of the squad web of that supervisor, which the page shows in a frame). Each workspace needs a token in web.workspace_tokens. A process variable cannot set it
# [[web.workspaces]]
# name = "shop"
# url = "http://127.0.0.1:7321"
# squad_web = "https://squad-shop.example.com"
#
# [[web.workspaces]]
# name = "lab"
# url = "https://lab.example.com"

# This repo's own supervisor, and its squad web (the squad-web unit on this machine).
[[web.workspaces]]
name = "squad"
url = "http://127.0.0.1:7341"
squad_web = "https://squad-dev.squad.doppelganger.hilman.dev"

[nightly]

# kill switch: the pass logs killed and returns before reading anything
# no_sandcastle = 0

# the branch a pass lands on; not set, the pass logs config-missing and does nothing; a checkout on any other branch refuses (not-on-base)
# sandcastle_base = ""

# run the agent and the gate for real, write nothing — no commit, no merge, no state. This dry run COSTS one agent pass; *_MAX=0 is the free one
# sandcastle_dry_run = 0

# kill switch: the pass commits inside its worktree and never moves the base branch
# no_sandcastle_merge = 0

# passes per tick. 0 is the free smoke test — everything but the agent — and it is free
# sandcastle_max = 1

# force one goal key instead of the rotation, for debugging one brief end to end
# sandcastle_only = ""

