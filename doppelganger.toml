# --- families whose table you choose ---

# redirect one integration's database to a throwaway file for a safe run
# [<name>] db

# --- flows ---
#
# A flow is one tracker and an ordered list of steps. Each `[flow.<name>]` table is one flow. A
# flow lives in this file only, never in doppelganger.secret.toml, and a bad one stops the
# supervisor, `npm run job` and `config check` at start. The comment above each key is its own
# `why`. A tracker kind and a step explain the other keys of their tables.
#
# A plain name in `steps` is a plugin step, and its table is `[flow.<name>.<step>]`. A local
# name, like deploy-dev, needs a table with `use` that names the step it runs.
#
# [flow.engine]
#
#   the tracker kind this flow reads and writes, by name
#   tracker = "github"
#
#   the steps in order; a plain name is a plugin step, a local name needs a table with use
#   steps = ["coder", "deploy-dev", "github.merge"]
#
#   logins whose reply releases a parked item
#   humans = ["hyhilman"]
#
#   who looks first at a parked step: the name of an answerer, or human for a person; a step table may set its own
#   asks = "smart"
#
#   the status the tracker is set to when the flow ends
#   done = "Done"
#
#   how many times a failed item goes back to the first step before it parks
#   max_replans = 2
#
#   the repos a plan may name; any other repo is refused
#   repos = ["hyhilman/doppelganger"]
#
#   the ntfy events this flow sends, from next, wait, fail, park, replan, needs-human, done, idle, blocked, error; a step with its own list covers its own results
#   notify = ["needs-human", "done", "idle", "blocked", "error"]
#
# [flow.engine.coder]
#
#   the status the tracker is set to when the step starts
#   status = "In Progress"
#
#   who looks first when this step parks: the name of an answerer, or human for a person; unset, the flow's asks covers it
#   asks = "human"
#
#   post the step's output as a comment when it ends
#   comment = false
#
#   the code host this step opens and reviews pull requests on, by the name a plugin gave its forge
#   forge = "github"
#
#   review rounds that ask for changes, since the last replan, before the step parks the item
#   max_rounds = 3
#
#   passes that hit a timeout or an idle, since the last replan, before the step parks the item and runs no more passes
#   max_stalls = 3
#
#   the branch every pull request of this step goes to; unset, each repo's own default branch
#   base = "main"
#
#   the ntfy events for this step's own results, from next, wait, fail, park; unset, the flow's list covers them
#   notify = ["park", "fail"]
#
# [flow.engine.deploy-dev]
#
#   the step this local name runs, when the name is not a step itself
#   use = "github.deploy"
#
# A step set is a list of steps, with their options, that several flows share. Each `[steps.<name>]`
# table is one set, and it needs a `list`. A flow that puts the set's name in its `steps` gets the
# list in that place, and may add steps before or after it. The options of a step come from the
# set's table `[steps.<name>.<step>]`, and the flow's own table for that step wins, key by key. A
# set does not name another set. To drop a step of a set, a flow writes its own list without the set.
# A step set lives in this file only, like a flow.
#
# [steps.code]
#
#   the steps this set stands for, in order, a plain step name each
#   list = ["coder", "github.merge"]
#
# [steps.code.coder]
#
#   review rounds that ask for changes, since the last replan, before the step parks the item
#   max_rounds = 5

# --- lanes ---
#
# A lane is one way the triage switch may route a conversation. Each `[lane.<name>]` table is one
# lane. The switch asks the decision model to pick one lane among those offered for the row's source,
# and the code writes the route of the lane's output. A lane adds no route of its own. A lane lives in
# this file only, never in doppelganger.secret.toml, and a bad one stops the supervisor, `npm run job`
# and `config check` at start. The comment above each key is its own `why`.
#
# The outputs and the route each one writes: none writes fyi, human writes human-action, human:now
# writes incident, flow:<name> writes that flow's route and ticket:<flow> writes that route.
#
# [lane.urgent]
#
#   the criteria the decision model judges a conversation against, in plain words
#   intent = "something is broken or degraded and needs attention at once"
#
#   what a conversation in this lane becomes: none (settled), human, human:now (pinged at once), flow:<name> (the flow's own route) or ticket:<flow> (the ask job files tickets)
#   output = "human:now"
#
# [lane.ask]
#
#   the criteria the decision model judges a conversation against, in plain words
#   intent = "someone asks me a question, or asks me for work, that I have to answer or do"
#
#   the sources this lane is offered for; unset, every source
#   sources = ["slack", "jira"]
#
#   what a conversation in this lane becomes: none (settled), human, human:now (pinged at once), flow:<name> (the flow's own route) or ticket:<flow> (the ask job files tickets)
#   output = "human"
#
# [lane.fyi]
#
#   the criteria the decision model judges a conversation against, in plain words
#   intent = "information only; nothing is asked of me, including a reply that answers me"
#
#   what a conversation in this lane becomes: none (settled), human, human:now (pinged at once), flow:<name> (the flow's own route) or ticket:<flow> (the ask job files tickets)
#   output = "none"
#
# [lane.alerts]
#
#   the criteria the decision model judges a conversation against, in plain words
#   intent = "an automatic alert"
#
#   what a conversation in this lane becomes: none (settled), human, human:now (pinged at once), flow:<name> (the flow's own route) or ticket:<flow> (the ask job files tickets)
#   output = "human"
#
#   a source whose rows always take this lane, by a code rule with no decision model
#   pin = "github"

